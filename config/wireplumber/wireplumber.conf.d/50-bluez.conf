# Best-quality Bluetooth audio settings (realme Buds Air 7: AAC is the max codec usable on Linux)
monitor.bluez.properties = {
  bluez5.a2dp.aac.bitratemode = 0       # 0 = CBR, always max bitrate
  bluez5.a2dp.aac.bitrate = 320000      # A2DP AAC ceiling
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc = true
  bluez5.roles = [ a2dp_sink a2dp_source hfp_hf hfp_ag ]
}
