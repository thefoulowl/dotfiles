# goforit EQ profile: Zeb EQ (Music)
# Runs as: pipewire -c ~/.config/pipewire/eq/zeb-music.conf
context.properties = { log.level = 0 }
context.spa-libs = { audio.convert.* = audioconvert/libspa-audioconvert  support.* = support/libspa-support }
context.modules = [
  { name = libpipewire-module-rt args = { nice.level = -11 } flags = [ ifexists nofail ] }
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Zeb EQ (Music)"
      media.name       = "Zeb EQ (Music)"
      filter.graph = {
        nodes = [
          { type = builtin label = bq_highpass name = hp control = { "Freq" = 55.0 "Q" = 0.7 "Gain" = 0.0 } }
          { type = builtin label = bq_peaking name = punch control = { "Freq" = 130.0 "Q" = 1.0 "Gain" = 4.0 } }
          { type = builtin label = bq_peaking name = mud control = { "Freq" = 350.0 "Q" = 1.2 "Gain" = -1.5 } }
          { type = builtin label = bq_peaking name = pres control = { "Freq" = 3000.0 "Q" = 1.5 "Gain" = 1.5 } }
          { type = builtin label = bq_peaking name = tinny control = { "Freq" = 5500.0 "Q" = 2.0 "Gain" = -2.0 } }
          { type = builtin label = bq_highshelf name = treb control = { "Freq" = 9000.0 "Q" = 0.7 "Gain" = 1.5 } }
        ]
        links = [
          { output = "hp:Out" input = "punch:In" }
          { output = "punch:Out" input = "mud:In" }
          { output = "mud:Out" input = "pres:In" }
          { output = "pres:Out" input = "tinny:In" }
          { output = "tinny:Out" input = "treb:In" }
        ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props  = { node.name = "eq_zeb-music" media.class = Audio/Sink }
      playback.props = { node.name = "eq_zeb-music_out" node.passive = true target.object = "@TARGET@" }
    }
  }
]
