# goforit EQ profile: Music
# Runs as: pipewire -c ~/.config/pipewire/eq/music.conf
context.properties = { log.level = 0 }
context.spa-libs = { audio.convert.* = audioconvert/libspa-audioconvert  support.* = support/libspa-support }
context.modules = [
  { name = libpipewire-module-rt args = { nice.level = -11 } flags = [ ifexists nofail ] }
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Buds EQ (Music)"
      media.name       = "Buds EQ (Music)"
      filter.graph = {
        nodes = [
          { type = builtin label = bq_lowshelf  name = bass  control = { "Freq" = 80.0   "Q" = 0.7 "Gain" = 3.5 } }
          { type = builtin label = bq_peaking   name = mud   control = { "Freq" = 300.0  "Q" = 1.2 "Gain" = -1.5 } }
          { type = builtin label = bq_peaking   name = pres  control = { "Freq" = 3000.0 "Q" = 1.5 "Gain" = 1.5 } }
          { type = builtin label = bq_highshelf name = treb  control = { "Freq" = 9000.0 "Q" = 0.7 "Gain" = 2.5 } }
        ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props  = { node.name = "eq_music" media.class = Audio/Sink }
      playback.props = { node.name = "eq_music_out" node.passive = true target.object = "@TARGET@" }
    }
  }
]
