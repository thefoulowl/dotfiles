# goforit EQ profile: Zeb EQ (Movie)
# Runs as: pipewire -c ~/.config/pipewire/eq/zeb-movie.conf
context.properties = { log.level = 0 }
context.spa-libs = { audio.convert.* = audioconvert/libspa-audioconvert  support.* = support/libspa-support }
context.modules = [
  { name = libpipewire-module-rt args = { nice.level = -11 } flags = [ ifexists nofail ] }
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Zeb EQ (Movie)"
      media.name       = "Zeb EQ (Movie)"
      filter.graph = {
        nodes = [
          { type = builtin label = bq_highpass name = hp control = { "Freq" = 60.0 "Q" = 0.7 "Gain" = 0.0 } }
          { type = builtin label = bq_peaking name = punch control = { "Freq" = 150.0 "Q" = 1.0 "Gain" = 3.0 } }
          { type = builtin label = bq_peaking name = mud control = { "Freq" = 400.0 "Q" = 1.2 "Gain" = -2.0 } }
          { type = builtin label = bq_peaking name = voice control = { "Freq" = 2500.0 "Q" = 1.0 "Gain" = 3.0 } }
          { type = builtin label = bq_peaking name = tinny control = { "Freq" = 5500.0 "Q" = 2.0 "Gain" = -2.5 } }
          { type = builtin label = bq_highshelf name = air control = { "Freq" = 10000.0 "Q" = 0.7 "Gain" = 1.0 } }
        ]
        links = [
          { output = "hp:Out" input = "punch:In" }
          { output = "punch:Out" input = "mud:In" }
          { output = "mud:Out" input = "voice:In" }
          { output = "voice:Out" input = "tinny:In" }
          { output = "tinny:Out" input = "air:In" }
        ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props  = { node.name = "eq_zeb-movie" media.class = Audio/Sink }
      playback.props = { node.name = "eq_zeb-movie_out" node.passive = true target.object = "@TARGET@" }
    }
  }
]
