# goforit EQ profile: Movie
# Runs as: pipewire -c ~/.config/pipewire/eq/movie.conf
context.properties = { log.level = 0 }
context.spa-libs = { audio.convert.* = audioconvert/libspa-audioconvert  support.* = support/libspa-support }
context.modules = [
  { name = libpipewire-module-rt args = { nice.level = -11 } flags = [ ifexists nofail ] }
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Buds EQ (Movie)"
      media.name       = "Buds EQ (Movie)"
      filter.graph = {
        nodes = [
          { type = builtin label = bq_lowshelf  name = sub   control = { "Freq" = 70.0   "Q" = 0.7 "Gain" = 3.0 } }
          { type = builtin label = bq_peaking   name = mud   control = { "Freq" = 250.0  "Q" = 1.0 "Gain" = -3.0 } }
          { type = builtin label = bq_peaking   name = voice control = { "Freq" = 2500.0 "Q" = 1.0 "Gain" = 3.5 } }
          { type = builtin label = bq_peaking   name = harsh control = { "Freq" = 6500.0 "Q" = 2.0 "Gain" = -2.0 } }
          { type = builtin label = bq_highshelf name = air   control = { "Freq" = 10000.0 "Q" = 0.7 "Gain" = 1.5 } }
        ]
        links = [
          { output = "sub:Out" input = "mud:In" }
          { output = "mud:Out" input = "voice:In" }
          { output = "voice:Out" input = "harsh:In" }
          { output = "harsh:Out" input = "air:In" }
        ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props  = { node.name = "eq_movie" media.class = Audio/Sink }
      playback.props = { node.name = "eq_movie_out" node.passive = true target.object = "@TARGET@" }
    }
  }
]
